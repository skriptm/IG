<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IG Growth">
<title>IG Growth</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>
<div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="app">
  <header class="hero" id="hero">
    <svg class="hero-mountains" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1714"/><stop offset=".7" stop-color="#2a1c12"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
        <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a2c"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
      </defs>
      <rect width="1200" height="300" fill="url(#sky)"/>
      <circle cx="930" cy="110" r="70" fill="#f07c1e" opacity=".12"/>
      <circle cx="930" cy="110" r="26" fill="#f07c1e" opacity=".22"/>
      <path d="M0 210 L120 150 L210 185 L330 110 L430 170 L520 130 L640 190 L760 120 L860 160 L980 100 L1100 165 L1200 135 L1200 300 L0 300Z" fill="#1d1c1e" opacity=".92"/>
      <path d="M330 110 L348 126 L332 122 L318 130Z M980 100 L1000 118 L982 114 L966 122Z" fill="#d9cfc4" opacity=".22"/>
      <path d="M0 250 L90 205 L200 235 L300 190 L420 240 L540 200 L660 245 L790 205 L900 240 L1010 210 L1120 245 L1200 220 L1200 300 L0 300Z" fill="url(#m1)"/>
    </svg>
    <canvas id="dust" class="dust" aria-hidden="true"></canvas>
    <div class="fog f1"></div><div class="fog f2"></div>
    <div class="hero-content">
      <div class="hero-top">
        <div>
          <div class="eyebrow">@andrelauinger</div>
          <h1>IG Growth</h1>
        </div>
        <div class="hero-btns">
          <a class="icon-btn" href="https://www.instagram.com/andrelauinger/" target="_blank" rel="noopener" aria-label="Instagram öffnen">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <button class="icon-btn" id="refresh-btn" aria-label="Instagram neu abfragen">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="hero-sub" id="hero-sub">Lädt …</div>
      <div class="pause-badge" id="hero-pause" hidden>⏸ Engagement pausiert</div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar"></nav>
  <div class="toast" id="toast"></div>
</div>

<script src="js/config.js?v=7"></script>
<script src="js/core.js?v=7"></script>
<script src="js/charts.js?v=7"></script>
<script src="js/modules/home.js?v=7"></script>
<script src="js/modules/growth.js?v=7"></script>
<script src="js/modules/content.js?v=7"></script>
<script src="js/modules/contacts.js?v=7"></script>
<script src="js/modules/settings.js?v=7"></script>
<script>App.start();</script>
</body>
</html>
